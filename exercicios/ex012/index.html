<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos em HTML5</title>
    
<body>
    <h1>Inserindo Vídeos hodpedados localmente</h1>
    <p>Estes vídeos estão hospedados no meu servidor</p>
    <video width="200" height="300" poster="" controls>
        <source src="midia/Meu-Video(1).mp4" type="video/mp4">
        <source src="midia/Meu-Video(2).webm" type="video/webm">
        <source src="midia/meu-video.mp4" type="video/mp4">
        <p>Seu navegador não tem compatibilidade co reprodução de vídos.</p>
    </video>
    <h1>Inserindo Vído do Youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/FdE5G95B7Mg?si=OnR0VzDi28IqW1xY" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    
</body>
</html>
